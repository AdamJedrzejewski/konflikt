name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowanie i uruchomienie kontenerów
        run: |
          echo "POSTGRES_PASSWORD=ci-$(date +%s)" > infra/docker/.env
          docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up -d --build --wait
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/api/v1/history
          docker compose -f infra/docker/docker-compose.yml exec -T backend python -c "from app.services.knowledge_bundle import KnowledgeBundle; assert KnowledgeBundle('/knowledge').metadata()['concepts'] == 82"
      - name: Dzienniki przy błędzie
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs
