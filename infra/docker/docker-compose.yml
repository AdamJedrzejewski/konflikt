version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obsil
      POSTGRES_PASSWORD: obsil
      POSTGRES_DB: obsil
    ports:
      - "127.0.0.1:5432:5432"   # tylko localhost — nie wystawiać bazy publicznie (zmiana 2026-06-28)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsil"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://obsil:obsil@db:5432/obsil
      LLM_PROVIDER: anthropic
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL_NAME: claude-sonnet-4-5
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../rules:/app/rules:ro

volumes:
  postgres_data:
